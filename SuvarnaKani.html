 it by picking its sound from lookalikes before the next one.","Reviews now check vowel length and puffed vs plain sounds. Type khao for \u0E02\u0E49\u0E32\u0E27 and you'll be asked: khaaw (long) or khao (short)? They're different words.","Practice is a grid of tools, grouped by skill. Tools appear when they become useful, each with a short intro the first time.","One placement run replaces the eight river buttons: pick how far to test, under Learn. Vacation mode in Settings pauses reviews and your streak, and one missed day a week no longer breaks a streak."]},{v:"0.33.0",title:"One clear daily loop",points:["New tabs: Today, Learn, Practice, Read and Me. Today fits on one screen: your session, your level and what opens next. The course map and Word Garden are under Learn; Ear, Write and Lab are under Practice; stats, the Ledger and the course switch are under Me.","Start today's session runs the whole Today Path in one flow: reviews, lessons, the Ear set and the day's practice, with the steps between and a summary at the end. No more hopping between tabs.","Word and syllable reviews now ask for the reading, then the meaning, as two answers. English alone no longer passes a card. Type the English in the reading box and the app asks for the sound instead of marking you wrong.","Plainer words: each stage says what it means (Novice Monk \xB7 learned), pitch numbers like 33 and 214 are off unless you turn them on in Settings, and empty screens say what opens them."]},{v:"0.32.0",title:"Extra practice",points:["Extra practice on the Shrine: a round of up to 15 letters and words you already know, weakest first, whenever you like, even with no reviews due.","It never changes anything: no stage, due date, ladder rung or level moves, right or wrong. Pick one level or all of them; burned items get a turn too.","A missed card comes back once before the round ends. Practice counts toward your streak but stays out of the Ledger."]},{v:"0.31.0",title:"Male and female voices",points:["Settings \u2192 Voices: pick a female or male voice for the app, or keep your device's own voice. Where a device offers several Thai or Lao voices, you can choose one by name.","Dialogues and Talk Paths now use a voice per speaker: your lines follow your particle (\u0E04\u0E23\u0E31\u0E1A is male), and the vendor, barista or driver follows theirs.","Most Android phones have only one Thai voice, so the other gender is made by shifting its pitch. Tone shapes are unchanged; it just sounds more synthetic. Edge on a computer has real voices for both."]},{v:"0.30.0",title:"Production track (optional)",points:["A new, optional track turns reading around: see the English, then build the Thai or Lao word from letter tiles (or type it on your own keyboard), and say it out loud. Turn it on in Settings or on the Shrine.","A word joins once its reading reaches Naga Adept, so you only produce words you already read easily.","It keeps its own memory, so a slip here never moves a word in your reading reviews. New and missed cards climb the same 4h, 8h, 1 day, 2 day ladder.","About ten cards a day, due ones first, as one more step in the Today Path. Saying is graded by you after you hear the model and, if you record, your own take."]},{v:"0.29.0",title:"A fuller Word Garden",points:["The Word Garden now has 465 words in 13 beds, each with its Lao word. New beds: Little words (\u0E44\u0E21\u0E48, \u0E08\u0E30, \u0E41\u0E25\u0E49\u0E27, question words), Shopping and colours, Home, Describing things, Weather, nature and animals, and School and work.","Every bed is split into small topic boxes, most useful words first. A planted bed starts with its first box; the next opens when 80% of the box before it reaches Novice Monk.","Words that were in the wrong bed have moved to their topic. Your progress moved with them.","150 sentence lines in each language. A line joins your sentence deck once you know every word in it."]},{v:"0.28.1",title:"\u0E04\u0E23\u0E31\u0E1A by default",points:["Your own lines in dialogues, Talk Paths and chat packs now use the male particle \u0E04\u0E23\u0E31\u0E1A unless you pick \u0E04\u0E48\u0E30 / \u0E04\u0E30 or Show both in Settings."]},{v:"0.28.0",title:"Guardian Trials",points:["Each level's guardian now tests you before the next level opens. When 90% of a level's letters reach Novice Monk, Face the guardian appears on the gate and in the Today Path.","Twelve prompts in four rounds: recognise, tone (colours hidden), listen, and read a word yourself. You have 3 lanterns and nothing relights them.","Pass to stamp your river passport and open the next level. A flawless run earns gold, and you can go back for it. Misses go back into your reviews, and the guardian returns once they're right there again.","Run the river skips ahead to any locked level with one lantern. Street Reader and Ride the line open with Level 7, Talk Paths with Level 8, and the Word Garden with the Level 4 trial. Levels you already had open stay open."]},{v:"0.27.0",title:"Letters first",points:["Words and syllables now wait until their letters reach Novice Monk, the way WaniKani waits on radicals.","New and missed items come back after 4 hours, 8 hours, 1 day and 2 days before the usual schedule takes over. Recent misses and leeches come first in reviews."]},{v:"0.26.0",title:"Only letters you know",points:["Practice modes now only show letters you've had lessons on. Locked items open as your course reaches their letters, and Unlock all levels still opens everything.","Mekong Predictor opens with Level 3 and only uses words you can read. It starts with a short explainer and an example, and each Lao tile shows the Thai letter it sounds like.","Script Slicer topics, Street Reader signs, Ride the line stops and the Classifier Corral open the same way. The Today Path only sends you to Mekong laws or street signs once they're open."]},{v:"0.25.0",title:"Hand and look",points:["Daylight theme for reading in the sun, and true black for night on an OLED screen. Both follow your phone unless you pick one in Settings.","The Shrine is now a journey down the Mekong: each level is a stop that fills with gold as its items burn, with the next gate in view.","Memory Writer (Write \u2192 From memory): hear a letter's name and write it with no template. Syllables puts whole syllables on a four-line guide.","Show me: a ghost pen draws each letter from its head loop before you trace it.","Keyboard (Write \u2192 Keyboard): hear a word and type it on the Thai Kedmanee layout your phone uses. Clean typing counts on the spelling track.","Tap a big letter in a lesson or the inspector to see its parts: the head loop, the body, and what tells it from its lookalike.","New stage colours and icons, from bronze seed to golden stupa, and short moments for burns, new levels and streaks."]},{v:"0.24.0",title:"Real voices",points:["Voice Bank (Ear \u2192 Voice Bank): hand the phone to a tutor or friend and they read each word. Their recordings replace the synthetic voice everywhere, and go into your backups.","Talk Paths (Ear): five conversations where you choose your reply, then say it. A politeness meter reacts to what you pick.","Sound Dojo (Ear Dojo): puffed or plain consonants, short or long vowels, hidden final stops and initial \u0E07.","Tones in phrases (Ear Dojo): name one syllable's tone inside running speech.","The Ear speeds up as you improve, from 0.7\xD7 to 1.2\xD7, and rotates the voices on your phone.","Hear yourself: after shadowing, play the model then your take, A then B. Your best take for each line is kept."]},{v:"0.23.0",title:"Read the world",points:["Lantern Library (Read \u2192 Library): twelve short stories in Thai and in Lao. Tap any word, read aloud with the sentence lit up, and time your re-reads to see your speed grow.","Press and hold a story sentence to add it to the Sentence deck.","Street Reader has 23 signs: road signs, a pharmacy, a hospital, a river pier, neon and worn paint, and a menu that changes every day.","Ride the line (Read): signs in the order you meet them, with a few seconds less at each stop.","Ledger on the Shrine: your last 26 weeks, recall by track against the 90% target, confused tones, hardest items, time studied and what's due.","Every answer is now kept on the phone for a year, and the daily log keeps a year too."]},{v:"0.22.0",title:"Words in the wild",points:["Word Garden: 280 everyday words in seven beds (food, getting around, numbers and time, people, body, feelings, verbs). It opens after Level 4; plant a bed and its words join your lessons.","Lesson cards play each word inside a short phrase.","Sentence deck on the Shrine: whole lines to read, hear and complete, about five new a day. Words saved in the Decoder join once you add a meaning.","Market Clock (Lab): hear prices, Thai six-period times and Buddhist-era years, and type or pick them.","Classifier Corral (Lab): sort things into \u0E04\u0E19, \u0E15\u0E31\u0E27, \u0E2D\u0E31\u0E19, \u0E43\u0E1A, \u0E40\u0E25\u0E48\u0E21, \u0E04\u0E31\u0E19, \u0E2B\u0E25\u0E31\u0E07 and \u0E25\u0E39\u0E01, then count them.","Typed readings are more forgiving: RTGS spellings, missing h, single vowels, g for k and l for r all count."]},{v:"0.21.0",title:"Take it outside",points:["Decoder (Read \u2192 Decoder): paste any Thai or Lao and see every syllable's class, live or dead, length, mark and tone. Words from your course are recognised.","Share text from Google Lens or any app to Suvar\u1E47aKani and it opens in the Decoder.","Long-press the app icon for Reviews, Ear Dojo and Decoder. The icon also works with Android's themed icons.","Tone colours: syllables are tinted by tone in the Decoder, Street Reader and Slicer, fading as you learn each word.","Font Gauntlet: read words in eight faces, from looped serif to handwriting, and drill letters in loopless type.","Romanisation can be learner spelling, RTGS or IPA (Settings), and reviews can show older items in random fonts.","The Slicer has 30 lines across 15 topics."]},{v:"0.20.0",title:"Safe ground",points:["Back up your progress to a file and restore it on any phone (Settings \u2192 Backup).","The phone keeps seven daily snapshots, so you can roll back to yesterday.","The Android back gesture closes sheets instead of leaving the app.","One Settings sheet: script, font, daily goal, audio, your polite particle, text size and haptics.","The screen stays on during reviews, lessons, tracing and shadowing.","A bar tells you when a new version is ready."]}],ad=e=>(e||"").replace(/[^฀-๿\s]/g,"").replace(/\s+/g," ").trim(),mf=e=>(e||"").replace(/[^຀-໿\s]/g,"").replace(/\s+/g," ").trim(),Zg=e=>e==="lo"?/^lo(-|_|$)/i:/^th(-|_|$)/i,h1=.72,m1=1.25,g1=/female|woman|premwadee|achara|kanya|narisa|keomany|kanokwan|wanida/i,x1=/\bmale\b|\bman\b|niwat|pattara|chanthavong|somchai/i;function lr(e){let t=`${e?.name||""} ${e?.voiceURI||""}`;return g1.test(t)?"female":x1.test(t)?"male":null}function xx(e,t){let a=t==="female"?"female":"male";if(!e||e.who==="You")return a;let n=e.th||"";return/ค่ะ|คะ(?!แนน)|ฉัน|ดิฉัน/.test(n)&&!/ครับ|ผม/.test(n)?"female":/ครับ|ผม/.test(n)?"male":a==="male"?"female":"male"}var gf=class{constructor(){if(this.ctx=null,this.nodes=[],this.speechTimer=null,this.rate=.85,this.muted=!1,this.voices=[],this.primed=!1,this.vp={gender:"auto",th:"",lo:"",speakers:!0},this.listeners=new Set,typeof window<"u"&&"speechSynthesis"in window){let t=()=>{this.voices=window.speechSynthesis.getVoices()||[],this.listeners.forEach(a=>a())};t(),window.speechSynthesis.addEventListener?.("voiceschanged",t)}}onVoices(t){return this.listeners.add(t),()=>this.listeners.delete(t)}thaiVoice(){return this.chosenVoice("th")||this.voices.find(t=>/^th(-|_|$)/i.test(t.lang))}chosenVoice(t){let a=this.vp[t];return a?this.voices.find(n=>n.voiceURI===a&&Zg(t).test(n.lang)):void 0}langVoices(t){return this.voices.filter(a=>Zg(t).test(a.lang))}resolveVoice(t,a,n=!1){let s=this.langVoices(t),l=this.chosenVoice(t)||s[0],r=a&&(n||this.vp.speakers)?
