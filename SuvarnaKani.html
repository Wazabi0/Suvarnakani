33 most Bangkok speakers say a long n\xE1am."},{id:"v-chaang",level:2,tier:"vocab",th:"\u0E0A\u0E49\u0E32\u0E07",lo:"\u0E8A\u0EC9\u0EB2\u0E87",thRoman:"ch\xE1ang",loRoman:"xaang",meaning:"elephant",accept:["chaang","chang","xaang","xang","saang","elephant"],ttsTh:"\u0E0A\u0E49\u0E32\u0E07",ttsLo:"\u0E0B\u0E49\u0E32\u0E07",tone:["high"],parts:{cls:"low",live:!0,long:!0,mark:"tho"},mnemonic:"The elephant trumpets high.",trap:"Low + Mai Tho = High.",bridge:"Thai \u0E0A \u2194 Lao \u0E8A: ch\xE1ang \u2194 xaang."},{id:"v-khaaw",level:2,tier:"vocab",th:"\u0E02\u0E49\u0E32\u0E27",lo:"\u0EC0\u0E82\u0EBB\u0EC9\u0EB2",thRoman:"kh\xE2aw",loRoman:"khao",meaning:"rice / food",accept:["khaaw","khaao","khao","kao","rice","food"],ttsTh:"\u0E02\u0E49\u0E32\u0E27",ttsLo:"\u0E40\u0E02\u0E49\u0E32",tone:["falling"],parts:{cls:"high",live:!0,long:!0,mark:"tho"},mnemonic:"High + Mai Tho falls: the rice sack drops.",trap:"Thai \u0E02\u0E49\u0E32\u0E27 (rice) vs \u0E40\u0E02\u0E49\u0E32 (enter) differ only in vowel length.",bridge:"Lao spells rice \u0EC0\u0E82\u0EBB\u0EC9\u0EB2, with a different vowel shape from Thai \u0E02\u0E49\u0E32\u0E27."},{id:"v-maa",level:2,tier:"vocab",th:"\u0E21\u0E32",lo:"\u0EA1\u0EB2",thRoman:"maa",loRoman:"maa",meaning:"come",accept:["maa","ma","come"],ttsTh:"\u0E21\u0E32",ttsLo:"\u0E21\u0E32",tone:["mid"],parts:{cls:"low",live:!0,long:!0,mark:"none"},mnemonic:"Come along at a calm Mid tone.",trap:"Part of the minimal triplet \u0E21\u0E32 (come) \xB7 \u0E21\u0E49\u0E32 (horse) \xB7 \u0E2B\u0E21\u0E32 (dog)."},{id:"g-pho",level:3,tier:"glyph",th:"\u0E1C",lo:"\u0E9C",thRoman:"ph \xB7 ph\u01CEw ph\u0289\u0302ng",loRoman:"ph \xB7 pho pheung",meaning:"ph sound \xB7 bee (\u0E1C\u0E36\u0E49\u0E07)",accept:["ph","p","pho","phor","phaw","bee"],ttsTh:"\u0E1C\u0E2D \u0E1C\u0E36\u0E49\u0E07",ttsLo:"\u0E1C\u0E2D \u0E40\u0E1C\u0E34\u0E49\u0E07",cls:"high",tone:["rising"],loop:"Head loop top-left. Down the left wall, up to a LOW inner peak, down, then up the right wall.",mne law","monkey"],ttsTh:"\u0E25\u0E2D \u0E25\u0E34\u0E07",ttsLo:"\u0E25\u0E2D \u0E25\u0E35\u0E07",cls:"low",tone:["mid"],loop:"Loop low on the left, round over the top, and a short drop on the right.",mnemonic:"The monkey (\u0E25\u0E34\u0E07) swings round the branch.",street:"Loopless \u0E25 and \u0E2A can blur; \u0E2A keeps a top-right flick.",trap:"\u0E25 vs \u0E2A vs \u0E28.",bridge:"Lao name word: \u0EA5\u0EB5\u0E87 (monkey), same word."},{id:"s-maa-r",level:3,tier:"syllable",th:"\u0E2B\u0E21\u0E32",lo:"\u0EDD\u0EB2",thRoman:"m\u01CEa",loRoman:"maa",meaning:"dog",accept:["maa","ma","dog"],ttsTh:"\u0E2B\u0E21\u0E32",ttsLo:"\u0E2B\u0E21\u0E32",tone:["rising"],parts:{cls:"low",live:!0,long:!0,mark:"none",hn:!0},mnemonic:"The silent Naga \u0E2B lifts \u0E21 into the sky: the dog's howl rises.",trap:"Completes the triplet: \u0E21\u0E32 (Mid, come) \xB7 \u0E21\u0E49\u0E32 (High, horse) \xB7 \u0E2B\u0E21\u0E32 (Rising, dog).",bridge:"Lao writes \u0EAB + \u0EA1 as the single letter \u0EDD."},{id:"s-naaw",level:3,tier:"syllable",th:"\u0E2B\u0E19\u0E32\u0E27",lo:"\u0EDC\u0EB2\u0EA7",thRoman:"n\u01CEaw",loRoman:"naao",meaning:"cold (weather)",accept:["naaw","naao","nao","cold"],ttsTh:"\u0E2B\u0E19\u0E32\u0E27",ttsLo:"\u0E2B\u0E19\u0E32\u0E27",tone:["rising"],parts:{cls:"low",live:!0,long:!0,mark:"none",hn:!0},mnemonic:"Shivering, your voice rises: n\u01CEaw.",trap:"\u0E2B is silent; it only changes the tone.",bridge:"Lao writes \u0EAB + \u0E99 as the single letter \u0EDC."},{id:"v-hello",level:3,tier:"vocab",th:"\u0E2A\u0E27\u0E31\u0E2A\u0E14\u0E35",lo:"\u0EAA\u0EB0\u0E9A\u0EB2\u0E8D\u0E94\u0EB5",thRoman:"s\xE0-w\xE0t-dii",loRoman:"sabaidee",meaning:"hello",accept:["sawatdee","sawasdee","sawatdii","sabaidee","sabaidii","hello","hi"],ttsTh:"\u0E2A\u0E27\u0E31\u0E2A\u0E14\u0E35",ttsLo:"\u0E2A\u0E30\u0E1A\u0E32\u0E22\u0E14\u0E35",tone:["low","low","mid"],mnemonic:"Thai greets with \u0E2A\u0E27\u0E31\u0E2A\u0E14\u0E35; Lao greets with \u0EAA\u0EB0\u0E9A\u0EB2\u0E8D\u0E94\u0EB5.",
