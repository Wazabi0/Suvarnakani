in consonants, short or long vowels, hidden final stops and initial \u0E07.","Tones in phrases (Ear Dojo): name one syllable's tone inside running speech.","The Ear speeds up as you improve, from 0.7\xD7 to 1.2\xD7, and rotates the voices on your phone.","Hear yourself: after shadowing, play the model then your take, A then B. Your best take for each line is kept."]},{v:"0.23.0",title:"Read the world",points:["Lantern Library (Read \u2192 Library): twelve short stories in Thai and in Lao. Tap any word, read aloud with the sentence lit up, and time your re-reads to see your speed grow.","Press and hold a story sentence to add it to the Sentence deck.","Street Reader has 23 signs: road signs, a pharmacy, a hospital, a river pier, neon and worn paint, and a menu that changes every day.","Ride the line (Read): signs in the order you meet them, with a few seconds less at each stop.","Ledger on the Shrine: your last 26 weeks, recall by track against the 90% target, confused tones, hardest items, time studied and what's due.","Every answer is now kept on the phone for a year, and the daily log keeps a year too."]},{v:"0.22.0",title:"Words in the wild",points:["Word Garden: 280 everyday words in seven beds (food, getting around, numbers and time, people, body, feelings, verbs). It opens after Level 4; plant a bed and its words join your lessons.","Lesson cards play each word inside a short phrase.","Sentence deck on the Shrine: whole lines to read, hear and complete, about five new a day. Words saved in the Decoder join once you add a meaning.","Market Clock (Lab): hear prices, Thai six-period times and Buddhist-era years, and type or pick them.","Classifier Corral (Lab): sort things into \u0E04\u0E19, \u0E15\u0E31\u0E27, \u0E2D\u0E31\u0E19, \u0E43\u0E1A, \u0E40\u0E25\u0E48\u0E21, \u0E04\u0E31\u0E19, \u0E2B\u0E25\u0E31\u0E07 and \u0E25\u0E39\u0E01, then count them.","Typed readings are more forgiving: RTGS spellings, missing h, single vowels, g for k and l for r all count."]},{v:"0.21.0",title:"Take it outside",points:["Decoder (Read \u2192 Decoder): paste any Thai or Lao and see every syllable's class, live or dead, length, mark and tone. Words from your course are recognised.","Share text from Google Lens or any app to Suvar\u1E47aKani and it opens in the Decoder.","Long-press the app icon for Reviews, Ear Dojo and Decoder. The icon also works with Android's themed icons.","Tone colours: syllables are tinted by tone in the Decoder, Street Reader and Slicer, fading as you learn each word.","Font Gauntlet: read words in eight faces, from looped serif to handwriting, and drill letters in loopless type.","Romanisation can be learner spelling, RTGS or IPA (Settings), and reviews can show older items in random fonts.","The Slicer has 30 lines across 15 topics."]},{v:"0.20.0",title:"Safe ground",points:["Back up your progress to a file and restore it on any phone (Settings \u2192 Backup).","The phone keeps seven daily snapshots, so you can roll back to yesterday.","The Android back gesture closes sheets instead of leaving the app.","One Settings sheet: script, font, daily goal, audio, your polite particle, text size and haptics.","The screen stays on during reviews, lessons, tracing and shadowing.","A bar tells you when a new version is ready."]}],Qu=e=>(e||"").replace(/[^฀-๿\s]/g,"").replace(/\s+/g," ").trim(),Zu=e=>(e||"").replace(/[^຀-໿\s]/g,"").replace(/\s+/g," ").trim(),Ju=class{constructor(){if(this.ctx=null,this.nodes=[],this.speechTimer=null,this.rate=.85,this.muted=!1,this.voices=[],this.primed=!1,this.listeners=new Set,typeof window<"u"&&"speechSynthesis"in window){let t=()=>{this.voices=window.speechSynthesis.getVoices()||[],this.listeners.forEach(a=>a())};t(),window.speechSynthesis.addEventListener?.("voiceschanged",t)}}onVoices(t){return this.listeners.add(t),()=>this.listeners.delete(t)}thaiVoice(){return this.voices.find(t=>/^th(-|_|$)/i.test(t.lang))}thaiVoices(){return this.voices.filter(t=>/^th(-|_|$)/i.test(t.lang))}laoV
